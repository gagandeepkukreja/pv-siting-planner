[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "arka"
version = "0.1.0"
description = "PV siting and sizing planner for the UK, India and UAE"
requires-python = ">=3.11"
license = { text = "MIT" }

[tool.setuptools]
packages = ["arka", "arka.agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = ["error::DeprecationWarning:arka.*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
